name: sync contributions

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-contributions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: regenerate contribution cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-contributions.mjs
      - name: commit if changed
        run: |
          if [[ -n "$(git status --porcelain projects/index.html)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add projects/index.html
            git commit -m 'projects: sync contribution cards from gh api'
            git push
          else
            echo 'no changes to commit'
          fi
