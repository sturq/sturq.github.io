<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="sturq · open source on github and gitlab">
<title>sturq</title>
<style>
  :root { color-scheme: dark; background: #000; color: white; }
  body, h1 { margin: 0; }
  main { min-height: 100vh; min-height: max(280px, 100svh); display: grid; place-items: center; position: relative; }
  h1 { font: 900 clamp(72px, 21vw, 200px)/1 system-ui, sans-serif; letter-spacing: -.055em; }
  canvas { position: absolute; width: min(100%, 900px); height: min(46%, 420px); touch-action: pan-y; }
  .painted { color: transparent; }
  nav { position: absolute; bottom: max(9%, env(safe-area-inset-bottom)); display: flex; align-items: center; gap: .25em; font: 14px/1.4 ui-monospace, monospace; }
  a { color: #aaa; padding: 14px 9px; text-decoration: none; }
  a:first-child { color: #eee; }
  a:hover, a:focus-visible { color: #71ebd2; text-decoration: underline; text-underline-offset: .35em; }
  nav span { color: #555; }
</style>
<script defer src="/wordmark.js"></script>
</head>
<body>
<main>
  <h1>sturq</h1>
  <canvas aria-hidden="true"></canvas>
  <nav aria-label="Links"><a href="/projects/">projects</a><span aria-hidden="true">/</span><a href="https://github.com/sturq">github</a><span aria-hidden="true">/</span><a href="https://gitlab.com/Sturq">gitlab</a></nav>
</main>
</body>
</html>
