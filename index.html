<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<meta name="theme-color" content="#2A3042">
<meta name="description" content="sturq — quiet machines for the late hours">
<link rel="preload" href="/assets/fonts/CormorantGaramond-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/CormorantGaramond-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
  <filter id="glass-distort" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="55" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<nav class="top">
  <a class="logo" href="/">
    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="currentColor"/>
    </svg>
    <span>sturq</span>
  </a>
  <div class="links">
    <a href="/projects/">projects</a>
  </div>
</nav>

<section class="hero">

  <!-- atmospheric layered scene: each layer anchored to its own viewport edge → scales gracefully on any aspect ratio -->
  <div class="hero-scene" aria-hidden="true">
    <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
      <defs>
        <linearGradient id="colBody" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
          <stop offset="20%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.4"/>
          <stop offset="80%"  stop-color="#FFFFFF" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="colCap" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.8"/>
          <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
        </linearGradient>
        <filter id="colSoft" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="0.5"/>
        </filter>
      </defs>
    </svg>

    <!-- left column anchored to left edge, full hero height -->
    <svg class="hero-col left" viewBox="0 0 100 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g filter="url(#colSoft)">
        <rect x="0"  y="22" width="100" height="22" rx="2" fill="url(#colCap)"/>
        <rect x="0"  y="22" width="100" height="2"  fill="#FFFFFF" fill-opacity="0.85"/>
        <rect x="14" y="44" width="72"  height="912" fill="url(#colBody)"/>
        <rect x="14" y="44" width="72"  height="1.5" fill="#FFFFFF" fill-opacity="0.7"/>
        <line x1="32" y1="50" x2="32" y2="950" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4"/>
        <line x1="50" y1="50" x2="50" y2="950" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.4"/>
        <line x1="68" y1="50" x2="68" y2="950" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4"/>
        <rect x="0"  y="956" width="100" height="22" rx="2" fill="url(#colCap)"/>
        <rect x="0"  y="956" width="100" height="2"  fill="#FFFFFF" fill-opacity="0.6"/>
      </g>
    </svg>

    <!-- right column (mirror of left via CSS scaleX) -->
    <svg class="hero-col right" viewBox="0 0 100 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <g filter="url(#colSoft)">
        <rect x="0"  y="22" width="100" height="22" rx="2" fill="url(#colCap)"/>
        <rect x="0"  y="22" width="100" height="2"  fill="#FFFFFF" fill-opacity="0.85"/>
        <rect x="14" y="44" width="72"  height="912" fill="url(#colBody)"/>
        <rect x="14" y="44" width="72"  height="1.5" fill="#FFFFFF" fill-opacity="0.7"/>
        <line x1="32" y1="50" x2="32" y2="950" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4"/>
        <line x1="50" y1="50" x2="50" y2="950" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.4"/>
        <line x1="68" y1="50" x2="68" y2="950" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.4"/>
        <rect x="0"  y="956" width="100" height="22" rx="2" fill="url(#colCap)"/>
        <rect x="0"  y="956" width="100" height="2"  fill="#FFFFFF" fill-opacity="0.6"/>
      </g>
    </svg>

    <!-- horizon plinth: full width across the bottom -->
    <svg class="hero-plinth" viewBox="0 0 1600 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0"  width="1600" height="6" fill="#B9C5EE" fill-opacity="0.45"/>
      <rect x="0" y="0"  width="1600" height="1" fill="#FFFFFF" fill-opacity="0.55"/>
      <rect x="0" y="20" width="1600" height="6" fill="#B9C5EE" fill-opacity="0.4"/>
      <rect x="0" y="20" width="1600" height="1" fill="#FFFFFF" fill-opacity="0.45"/>
      <rect x="0" y="40" width="1600" height="6" fill="#B9C5EE" fill-opacity="0.35"/>
      <rect x="0" y="40" width="1600" height="1" fill="#FFFFFF" fill-opacity="0.35"/>
      <rect x="0" y="60" width="1600" height="6" fill="#B9C5EE" fill-opacity="0.3"/>
      <rect x="0" y="74" width="1600" height="4" fill="#B9C5EE" fill-opacity="0.25"/>
    </svg>
  </div>

  <!-- center geometric lambda -->
  <div class="bust-wrap" aria-hidden="true">
    <svg class="bust" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lamGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.7"/>
        </linearGradient>
      </defs>
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="url(#lamGrad)"/>
    </svg>
  </div>

  <h1>sturq</h1>
  <p class="tagline">quiet machines for the late hours</p>
</section>

<section class="manifesto reveal">
  <blockquote>
    in the silence between requests, the machine dreams of marble and city rain.
    <cite>fragment · iv</cite>
  </blockquote>
</section>

<footer>sturq</footer>

<!-- corner geometric lambda -->
<svg class="mascot" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="#B9C5EE"/>
</svg>

<script src="/main.js" defer></script>
</body>
</html>
