<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true">
    <span class="bubble b1"></span>
    <span class="bubble b2"></span>
    <span class="bubble b3"></span>
    <span class="bubble b4"></span>
    <span class="bubble b5"></span>
    <span class="bubble b6"></span>
    <span class="bubble b7"></span>
    <span class="bubble b8"></span>
  </div>

  <div class="bg-grid"></div>

  <main>
    <div class="brackets-left">&lt;</div>

    <div class="name-wrap">
      <div class="kicker">~/</div>
      <h1 class="name">sturq</h1>
      <div class="line"></div>
      <div class="dots">
        <span class="dot d1"></span>
        <span class="dot d2"></span>
        <span class="dot d3"></span>
        <span class="dot d4"></span>
      </div>
    </div>

    <div class="brackets-right">/&gt;</div>
  </main>

  <footer class="foot">
    <span class="foot-item">nord</span>
    <span class="foot-sep">·</span>
    <span class="foot-item">2026</span>
  </footer>

  <script>
  (function () {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;

    const bubbles = Array.from(document.querySelectorAll('.bubble'));
    if (!bubbles.length) return;

    const state = bubbles.map(el => {
      const r = el.getBoundingClientRect();
      return {
        el,
        cx: r.left + r.width / 2,
        cy: r.top + r.height / 2,
        size: r.width,
        ox: 0, oy: 0,
        vx: 0, vy: 0,
      };
    });

    let pointer = { x: -9999, y: -9999, active: false };

    const recalc = () => {
      state.forEach(b => {
        b.el.style.transform = '';
        const r = b.el.getBoundingClientRect();
        b.cx = r.left + r.width / 2;
        b.cy = r.top + r.height / 2;
        b.size = r.width;
      });
    };
    window.addEventListener('resize', recalc, { passive: true });

    const onMove = (x, y) => {
      pointer.x = x; pointer.y = y; pointer.active = true;
    };
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseleave', () => { pointer.active = false; }, { passive: true });
    window.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (t) onMove(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchstart', e => {
      const t = e.touches[0];
      if (t) onMove(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { pointer.active = false; }, { passive: true });

    const tick = () => {
      state.forEach(b => {
        const targetX = pointer.active ? b.cx + b.ox : b.cx;
        const targetY = pointer.active ? b.cy + b.oy : b.cy;
        const dx = targetX - pointer.x;
        const dy = targetY - pointer.y;
        const dist = Math.hypot(dx, dy);
        const radius = b.size * 0.9 + 80;

        let pushX = 0, pushY = 0;
        if (pointer.active && dist < radius && dist > 0.01) {
          const force = (1 - dist / radius);
          const strength = force * force * 90;
          pushX = (dx / dist) * strength;
          pushY = (dy / dist) * strength;
        }

        b.vx += (pushX - b.ox) * 0.08;
        b.vy += (pushY - b.oy) * 0.08;
        b.vx *= 0.82;
        b.vy *= 0.82;
        b.ox += b.vx;
        b.oy += b.vy;

        b.el.style.translate = `${b.ox.toFixed(2)}px ${b.oy.toFixed(2)}px`;
      });
      requestAnimationFrame(tick);
    };

    requestAnimationFrame(() => { recalc(); tick(); });
  })();
  </script>
</body>
</html>
