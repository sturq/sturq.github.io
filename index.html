<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<meta name="theme-color" content="#2A3042">
<meta name="description" content="sturq — quiet machines for the late hours">
<link rel="preload" href="/assets/fonts/CormorantGaramond-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/CormorantGaramond-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
  <filter id="glass-distort" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="55" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<nav class="top">
  <a class="logo" href="/">
    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="currentColor"/>
    </svg>
    <span>sturq</span>
  </a>
  <div class="links">
    <a href="/projects/">projects</a>
  </div>
</nav>

<section class="hero">

  <!-- halftone classical scene: doric columns + arches -->
  <div class="hero-scene" aria-hidden="true">
    <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="halftone" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.1" fill="#B9C5EE"/>
        </pattern>
        <linearGradient id="colFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#B9C5EE" stop-opacity="0"/>
          <stop offset="20%" stop-color="#B9C5EE" stop-opacity="0.7"/>
          <stop offset="80%" stop-color="#B9C5EE" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0"/>
        </linearGradient>
        <mask id="sceneMask">
          <rect width="1600" height="900" fill="black"/>
          <!-- 5 Doric columns -->
          <g fill="white">
            <rect x="120" y="160" width="60" height="600" rx="2"/>
            <rect x="115" y="155" width="70" height="14" rx="2"/>
            <rect x="115" y="755" width="70" height="14" rx="2"/>
            <rect x="350" y="200" width="60" height="560" rx="2"/>
            <rect x="345" y="195" width="70" height="14" rx="2"/>
            <rect x="345" y="755" width="70" height="14" rx="2"/>
            <rect x="1190" y="200" width="60" height="560" rx="2"/>
            <rect x="1185" y="195" width="70" height="14" rx="2"/>
            <rect x="1185" y="755" width="70" height="14" rx="2"/>
            <rect x="1420" y="160" width="60" height="600" rx="2"/>
            <rect x="1415" y="155" width="70" height="14" rx="2"/>
            <rect x="1415" y="755" width="70" height="14" rx="2"/>
          </g>
          <!-- column fluting (vertical lines that darken interior) -->
          <g fill="black">
            <rect x="135" y="170" width="3" height="580"/>
            <rect x="145" y="170" width="3" height="580"/>
            <rect x="155" y="170" width="3" height="580"/>
            <rect x="165" y="170" width="3" height="580"/>
            <rect x="365" y="210" width="3" height="540"/>
            <rect x="375" y="210" width="3" height="540"/>
            <rect x="385" y="210" width="3" height="540"/>
            <rect x="395" y="210" width="3" height="540"/>
            <rect x="1205" y="210" width="3" height="540"/>
            <rect x="1215" y="210" width="3" height="540"/>
            <rect x="1225" y="210" width="3" height="540"/>
            <rect x="1235" y="210" width="3" height="540"/>
            <rect x="1435" y="170" width="3" height="580"/>
            <rect x="1445" y="170" width="3" height="580"/>
            <rect x="1455" y="170" width="3" height="580"/>
            <rect x="1465" y="170" width="3" height="580"/>
          </g>
          <!-- pediment top architrave -->
          <g fill="white">
            <rect x="100" y="130" width="1400" height="24" rx="2"/>
            <polygon points="100,130 800,40 1500,130"/>
          </g>
        </mask>
      </defs>

      <!-- apply pattern through mask -->
      <rect width="1600" height="900" fill="url(#halftone)" mask="url(#sceneMask)"/>

      <!-- horizon stairs -->
      <g fill="#B9C5EE" opacity="0.35">
        <rect x="0" y="780" width="1600" height="6"/>
        <rect x="0" y="795" width="1600" height="6"/>
        <rect x="0" y="810" width="1600" height="6"/>
        <rect x="0" y="825" width="1600" height="6"/>
        <rect x="0" y="840" width="1600" height="6"/>
      </g>
    </svg>
  </div>

  <!-- center geometric lambda -->
  <div class="bust-wrap" aria-hidden="true">
    <svg class="bust" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lamGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.7"/>
        </linearGradient>
      </defs>
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="url(#lamGrad)"/>
    </svg>
  </div>

  <h1>sturq</h1>
  <p class="tagline">quiet machines for the late hours</p>
</section>

<section class="manifesto reveal">
  <blockquote>
    in the silence between requests, the machine dreams of marble and city rain.
    <cite>fragment · iv</cite>
  </blockquote>
</section>

<footer>sturq</footer>

<!-- corner geometric lambda -->
<svg class="mascot" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="#B9C5EE"/>
</svg>

<script src="/main.js" defer></script>
</body>
</html>
