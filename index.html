<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<meta name="theme-color" content="#2A3042">
<meta name="description" content="sturq — quiet machines for the late hours">
<link rel="preload" href="/assets/fonts/CormorantGaramond-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/CormorantGaramond-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
  <filter id="glass-distort" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="55" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<nav class="top">
  <a class="logo" href="/">
    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="currentColor"/>
    </svg>
    <span>sturq</span>
  </a>
  <div class="links">
    <a href="/projects/">projects</a>
  </div>
</nav>

<section class="hero">

  <!-- liquid-glass classical scene: doric columns + pediment -->
  <div class="hero-scene" aria-hidden="true">
    <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
          <stop offset="18%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.32"/>
          <stop offset="82%"  stop-color="#FFFFFF" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="glassEdgeL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
          <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="glassEdgeR" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="capStone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.7"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
        </linearGradient>
        <linearGradient id="pedGloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.8"/>
          <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <filter id="colBlur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
      </defs>

      <!-- pediment + architrave -->
      <g filter="url(#colBlur)">
        <polygon points="100,130 800,40 1500,130" fill="url(#pedGloss)" opacity="0.85"/>
        <polygon points="100,130 800,40 1500,130" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.4"/>
        <rect x="100" y="130" width="1400" height="24" rx="3" fill="url(#pedGloss)" opacity="0.85"/>
        <rect x="100" y="130" width="1400" height="1.2" fill="#FFFFFF" opacity="0.7"/>
        <rect x="100" y="152.8" width="1400" height="1.2" fill="#B9C5EE" opacity="0.45"/>
      </g>

      <!-- columns: body + caps + edge highlights -->
      <g filter="url(#colBlur)">
        <!-- col 1 -->
        <rect x="120" y="160" width="60" height="600" rx="3" fill="url(#glassBody)"/>
        <rect x="120" y="160" width="20" height="600" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="160" y="160" width="20" height="600" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="120" y="160" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="120" y="758.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="115" y="155" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="115" y="155" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="115" y="755" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="115" y="755" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>

        <!-- col 2 -->
        <rect x="350" y="200" width="60" height="560" rx="3" fill="url(#glassBody)"/>
        <rect x="350" y="200" width="20" height="560" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="390" y="200" width="20" height="560" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="350" y="200" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="350" y="758.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="345" y="195" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="345" y="195" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="345" y="755" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="345" y="755" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>

        <!-- col 3 -->
        <rect x="1190" y="200" width="60" height="560" rx="3" fill="url(#glassBody)"/>
        <rect x="1190" y="200" width="20" height="560" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="1230" y="200" width="20" height="560" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="1190" y="200" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="1190" y="758.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="1185" y="195" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="1185" y="195" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="1185" y="755" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="1185" y="755" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>

        <!-- col 4 -->
        <rect x="1420" y="160" width="60" height="600" rx="3" fill="url(#glassBody)"/>
        <rect x="1420" y="160" width="20" height="600" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="1460" y="160" width="20" height="600" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="1420" y="160" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="1420" y="758.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="1415" y="155" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="1415" y="155" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="1415" y="755" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="1415" y="755" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>
      </g>

      <!-- horizon stairs (glass plinth) -->
      <g>
        <rect x="0" y="780" width="1600" height="6" fill="#B9C5EE" opacity="0.45"/>
        <rect x="0" y="780" width="1600" height="1" fill="#FFFFFF" opacity="0.55"/>
        <rect x="0" y="795" width="1600" height="6" fill="#B9C5EE" opacity="0.4"/>
        <rect x="0" y="795" width="1600" height="1" fill="#FFFFFF" opacity="0.45"/>
        <rect x="0" y="810" width="1600" height="6" fill="#B9C5EE" opacity="0.35"/>
        <rect x="0" y="810" width="1600" height="1" fill="#FFFFFF" opacity="0.35"/>
        <rect x="0" y="825" width="1600" height="6" fill="#B9C5EE" opacity="0.3"/>
        <rect x="0" y="840" width="1600" height="6" fill="#B9C5EE" opacity="0.25"/>
      </g>
    </svg>
  </div>

  <!-- center geometric lambda -->
  <div class="bust-wrap" aria-hidden="true">
    <svg class="bust" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lamGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.7"/>
        </linearGradient>
      </defs>
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="url(#lamGrad)"/>
    </svg>
  </div>

  <h1>sturq</h1>
  <p class="tagline">quiet machines for the late hours</p>
</section>

<section class="agora reveal" id="agora" aria-hidden="true">
  <svg viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="orbGlass" cx="32%" cy="28%" r="72%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="22%"  stop-color="#FFFFFF" stop-opacity="0.55"/>
        <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.42"/>
        <stop offset="82%"  stop-color="#404661" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#1f2333" stop-opacity="0.75"/>
      </radialGradient>
      <radialGradient id="orbHalo" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#B9C5EE" stop-opacity="0.32"/>
        <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbSpecular" cx="32%" cy="22%" r="22%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="orbRim" cx="50%" cy="50%" r="50%">
        <stop offset="80%"  stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="92%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.4"/>
      </radialGradient>
      <filter id="orbSoft" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="0.4"/>
      </filter>
    </defs>

    <!-- constellation lines: soft glass strokes weaving between orbs -->
    <g class="agora-lines" stroke="#B9C5EE" stroke-opacity="0.22" stroke-width="1" fill="none">
      <line x1="280"  y1="220" x2="540"  y2="370"/>
      <line x1="540"  y1="370" x2="820"  y2="200"/>
      <line x1="820"  y1="200" x2="1080" y2="430"/>
      <line x1="1080" y1="430" x2="1320" y2="240"/>
      <line x1="280"  y1="220" x2="820"  y2="200" stroke-opacity="0.12" stroke-dasharray="3 6"/>
      <line x1="820"  y1="200" x2="1320" y2="240" stroke-opacity="0.12" stroke-dasharray="3 6"/>
    </g>

    <!-- 5 glass orbs at varied scales, drifting independently -->
    <g class="orb orb-1">
      <circle cx="280" cy="220" r="170" fill="url(#orbHalo)"/>
      <circle cx="280" cy="220" r="80"  fill="url(#orbGlass)" filter="url(#orbSoft)"/>
      <circle cx="280" cy="220" r="80"  fill="url(#orbRim)"/>
      <ellipse cx="254" cy="196" rx="22" ry="14" fill="url(#orbSpecular)"/>
      <ellipse cx="305" cy="252" rx="10" ry="4"  fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <g class="orb orb-2">
      <circle cx="540" cy="370" r="120" fill="url(#orbHalo)"/>
      <circle cx="540" cy="370" r="55"  fill="url(#orbGlass)" filter="url(#orbSoft)"/>
      <circle cx="540" cy="370" r="55"  fill="url(#orbRim)"/>
      <ellipse cx="523" cy="354" rx="15" ry="9" fill="url(#orbSpecular)"/>
      <ellipse cx="558" cy="392" rx="7"  ry="3" fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <g class="orb orb-3">
      <circle cx="820" cy="200" r="210" fill="url(#orbHalo)"/>
      <circle cx="820" cy="200" r="100" fill="url(#orbGlass)" filter="url(#orbSoft)"/>
      <circle cx="820" cy="200" r="100" fill="url(#orbRim)"/>
      <ellipse cx="788" cy="172" rx="28" ry="17" fill="url(#orbSpecular)"/>
      <ellipse cx="852" cy="238" rx="13" ry="5"  fill="#FFFFFF" fill-opacity="0.25"/>
      <!-- inner reflection ring -->
      <circle cx="820" cy="200" r="68" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="0.8"/>
    </g>

    <g class="orb orb-4">
      <circle cx="1080" cy="430" r="150" fill="url(#orbHalo)"/>
      <circle cx="1080" cy="430" r="70"  fill="url(#orbGlass)" filter="url(#orbSoft)"/>
      <circle cx="1080" cy="430" r="70"  fill="url(#orbRim)"/>
      <ellipse cx="1058" cy="410" rx="19" ry="12" fill="url(#orbSpecular)"/>
      <ellipse cx="1102" cy="455" rx="9"  ry="3"  fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <g class="orb orb-5">
      <circle cx="1320" cy="240" r="135" fill="url(#orbHalo)"/>
      <circle cx="1320" cy="240" r="60"  fill="url(#orbGlass)" filter="url(#orbSoft)"/>
      <circle cx="1320" cy="240" r="60"  fill="url(#orbRim)"/>
      <ellipse cx="1301" cy="222" rx="16" ry="10" fill="url(#orbSpecular)"/>
      <ellipse cx="1338" cy="266" rx="8"  ry="3"  fill="#FFFFFF" fill-opacity="0.25"/>
    </g>

    <!-- floating greek inscription -->
    <g class="agora-label" fill="#9CA7CE" font-family="Cormorant, serif" font-size="22" letter-spacing="14" opacity="0.45">
      <text x="800" y="640" text-anchor="middle">ΑΓΟΡΑ · ΣΟΦΙΑ · ΑΛΗΘΕΙΑ</text>
    </g>

    <!-- horizon line: thin glass band echoing the temple plinth -->
    <g>
      <rect x="0" y="660" width="1600" height="3" fill="#B9C5EE" fill-opacity="0.3"/>
      <rect x="0" y="660" width="1600" height="0.6" fill="#FFFFFF" fill-opacity="0.5"/>
      <rect x="0" y="678" width="1600" height="2" fill="#B9C5EE" fill-opacity="0.18"/>
    </g>
  </svg>
</section>

<section class="manifesto reveal">
  <blockquote>
    in the silence between requests, the machine dreams of marble and city rain.
    <cite>fragment · iv</cite>
  </blockquote>
</section>

<footer>sturq</footer>

<!-- corner geometric lambda -->
<svg class="mascot" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="#B9C5EE"/>
</svg>

<script src="/main.js" defer></script>
</body>
</html>
