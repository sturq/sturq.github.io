<style>
  @font-face { font-family: "Roboto Flex"; src: url("/assets/fonts/RobotoFlex-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  /* material you dark, the grapheneos pixel 8 pro scheme (same tokens as style.css) */
  :root { color-scheme: dark; --p: #B9C5EE; --on-p: #333F61; --pc: #455174; --on-pc: #DBE2FF; --sc: #353B4D; --on-sc: #B9BED5; --bg: #0D0E12; --fg: #E4E5F0; }
  * { box-sizing: border-box; }
  [hidden] { display: none; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.4 "Roboto Flex", Roboto, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--p); outline-offset: 3px; }
  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: clamp(40px, 7vw, 96px); padding: 48px 24px; }
  /* the m3 cookie shape, slowly turning, with a tonal shadow */
  .mark { position: relative; width: clamp(200px, 26vw, 300px); aspect-ratio: 1; flex: none; display: grid; place-items: center; }
  .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--pc); animation: spin 48s linear infinite; }
  .mark .shadow { fill: var(--sc); translate: 14px 14px; animation-direction: reverse; }
  .mark span { position: relative; font-size: clamp(96px, 13vw, 150px); font-weight: 700; line-height: 1; color: var(--on-pc); translate: 0 -.08em; }
  @keyframes spin { to { rotate: 360deg; } }
  h1 { margin: 0; font-size: clamp(56px, 8vw, 96px); font-weight: 700; letter-spacing: -.035em; line-height: .95; }
  .pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 24px 0 18px; border-radius: 24px; background: var(--sc); color: var(--on-sc); font-weight: 600; transition: border-radius .2s, filter .2s; }
  .pill.main { background: var(--p); color: var(--on-p); }
  .pill:hover { filter: brightness(1.1); }
  .pill:active { border-radius: 12px; } /* m3 expressive: buttons go squarer while pressed */
  .pill svg { width: 20px; height: 20px; fill: currentColor; }
  @media (max-width: 760px) {
    .stage { flex-direction: column; text-align: center; gap: 44px; padding: 56px 16px; }
    .mark { width: min(240px, 62vw); }
    .pills { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { .mark svg { animation: none; } .pill { transition: none; } }
</style>
