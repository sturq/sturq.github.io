<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<meta name="theme-color" content="#2e3440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,200..700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="blob b5"></span>
  </div>

  <main class="bento">

    <article class="tile tile-hero">
      <div class="hero-corner">
        <span class="status-dot"></span>
        <span class="status-text">currently online</span>
      </div>
      <h1 class="name">sturq</h1>
      <p class="bio">a person on the internet</p>
      <div class="signature">
        <svg viewBox="0 0 40 40" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M8 28 Q14 8, 20 20 T32 12"></path>
        </svg>
      </div>
    </article>

    <article class="tile tile-time">
      <div class="tile-eyebrow">now</div>
      <div class="tile-big" id="clock">--:--</div>
      <div class="tile-sub" id="day">somewhere</div>
    </article>

    <article class="tile tile-vibe">
      <div class="tile-eyebrow">vibe</div>
      <div class="vibe-rings">
        <span class="ring"></span>
        <span class="ring"></span>
        <span class="ring"></span>
      </div>
      <div class="tile-sub">cosmic</div>
    </article>

    <article class="tile tile-stack">
      <div class="tile-eyebrow">stack</div>
      <div class="badge-row">
        <span class="badge">html</span>
        <span class="badge">css</span>
        <span class="badge">js</span>
        <span class="badge">caffeine</span>
      </div>
    </article>

    <article class="tile tile-quote">
      <svg class="quote-mark" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M7 7h4l-2 5h2v5H4v-5l3-5zm10 0h4l-2 5h2v5h-7v-5l3-5z"/>
      </svg>
      <p class="quote-text">slow internet builds character</p>
    </article>

    <button class="fab" aria-label="say hi">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
    </button>

  </main>

  <script>
  (function () {
    'use strict';
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Clock */
    const $clock = document.getElementById('clock');
    const $day   = document.getElementById('day');
    const updateClock = () => {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      $clock.textContent = `${hh}:${mm}`;
      const names = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
      $day.textContent = names[d.getDay()];
    };
    updateClock();
    setInterval(updateClock, 30000);

    /* Cursor-reactive blobs */
    if (!reduce) {
      const blobs = Array.from(document.querySelectorAll('.blob'));
      const state = blobs.map(el => {
        const r = el.getBoundingClientRect();
        return { el, cx: r.left + r.width/2, cy: r.top + r.height/2, size: r.width, ox: 0, oy: 0, vx: 0, vy: 0 };
      });
      let p = { x: -9999, y: -9999, active: false };
      const recalc = () => state.forEach(b => {
        b.el.style.translate = '';
        const r = b.el.getBoundingClientRect();
        b.cx = r.left + r.width/2; b.cy = r.top + r.height/2; b.size = r.width;
        b.el.style.translate = `${b.ox.toFixed(2)}px ${b.oy.toFixed(2)}px`;
      });
      const move = (x, y) => { p.x = x; p.y = y; p.active = true; };
      window.addEventListener('resize', recalc, { passive: true });
      window.addEventListener('mousemove', e => move(e.clientX, e.clientY), { passive: true });
      window.addEventListener('mouseleave', () => { p.active = false; }, { passive: true });
      window.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) move(t.clientX, t.clientY); }, { passive: true });
      window.addEventListener('touchstart', e => { const t = e.touches[0]; if (t) move(t.clientX, t.clientY); }, { passive: true });
      window.addEventListener('touchend', () => { p.active = false; }, { passive: true });

      const tick = () => {
        state.forEach(b => {
          const dx = (b.cx + b.ox) - p.x;
          const dy = (b.cy + b.oy) - p.y;
          const dist = Math.hypot(dx, dy);
          const radius = b.size * 0.85 + 90;
          let pushX = 0, pushY = 0;
          if (p.active && dist < radius && dist > 0.01) {
            const f = (1 - dist / radius);
            const s = f * f * 110;
            pushX = (dx / dist) * s;
            pushY = (dy / dist) * s;
          }
          b.vx += (pushX - b.ox) * 0.07;
          b.vy += (pushY - b.oy) * 0.07;
          b.vx *= 0.84;
          b.vy *= 0.84;
          b.ox += b.vx;
          b.oy += b.vy;
          b.el.style.translate = `${b.ox.toFixed(2)}px ${b.oy.toFixed(2)}px`;
        });
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(() => { recalc(); tick(); });
    }

    /* Ripple effect */
    function attachRipple(el) {
      el.addEventListener('pointerdown', e => {
        const rect = el.getBoundingClientRect();
        const r = document.createElement('span');
        r.className = 'ripple';
        r.style.left = (e.clientX - rect.left) + 'px';
        r.style.top  = (e.clientY - rect.top)  + 'px';
        el.appendChild(r);
        setTimeout(() => r.remove(), 650);
      });
    }
    document.querySelectorAll('.tile, .fab').forEach(attachRipple);
  })();
  </script>
</body>
</html>
