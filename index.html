<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<meta name="theme-color" content="#0a0604">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="crt">
    <div class="screen">
      <div class="screen-glare"></div>
      <div class="bezel-title">tty1</div>

      <div class="term" id="term" tabindex="0">
        <div class="output" id="output" aria-live="polite"></div>
        <div class="prompt-line" id="promptLine">
          <span class="prompt" id="prompt">sturq@web:~$&nbsp;</span><span class="input-wrap"><span class="input-text" id="inputText"></span><span class="caret" id="caret">█</span></span>
        </div>
      </div>
    </div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="flicker"></div>
  </div>

  <input id="hiddenInput" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" aria-label="terminal input">

  <script>
  (function () {
    'use strict';

    const MAX_INPUT = 200;
    const MAX_HISTORY = 100;
    const ALLOWED_THEMES = ['ember', 'green', 'amber', 'blue', 'white'];

    const $term       = document.getElementById('term');
    const $output     = document.getElementById('output');
    const $promptLine = document.getElementById('promptLine');
    const $prompt     = document.getElementById('prompt');
    const $inputText  = document.getElementById('inputText');
    const $caret      = document.getElementById('caret');
    const $hidden     = document.getElementById('hiddenInput');

    let buffer  = '';
    let history = [];
    let histIdx = -1;
    let busy    = false;

    /* ---- output helpers (always textContent, never innerHTML) ---- */
    function writeLine(text, cls) {
      const line = document.createElement('div');
      line.className = 'line' + (cls ? ' ' + cls : '');
      line.textContent = text == null ? '' : String(text);
      $output.appendChild(line);
    }
    function writeLines(arr, cls) {
      (arr || []).forEach(l => writeLine(l, cls));
    }
    function writeBlank() { writeLine(''); }

    function scrollDown() {
      $term.scrollTop = $term.scrollHeight;
    }

    /* ---- in-memory "filesystem" (static strings only) ---- */
    const fs = {
      'about.txt': [
        'sturq',
        '~~~~~',
        'a person on the internet.',
        'likes: making things, finding edge cases,',
        '       slow internet, ctrl+c.',
      ],
      'readme.md': [
        '# readme',
        '',
        'this is a fake terminal. it is safe.',
        'no commands actually run on a server.',
        'try: help, ls, neofetch, theme amber',
      ],
      'contact.txt': [
        'github: sturq',
        '(everything else is private)',
      ],
      'secrets.txt': [
        'permission denied: nice try.',
      ],
    };

    /* ---- commands (strict whitelist) ---- */
    const commands = {
      help: () => writeLines([
        'available commands:',
        '  help          show this list',
        '  whoami        display current user',
        '  about         about sturq',
        '  ls            list files',
        '  cat <file>    print file contents',
        '  echo <text>   print text',
        '  date          current date and time',
        '  uptime        how long since boot',
        '  neofetch      stylized system info',
        '  history       command history',
        '  theme <name>  ember | green | amber | blue | white',
        '  clear         clear screen',
        '  banner        re-show the boot banner',
        '  exit          (you can\'t, sorry)',
      ]),

      whoami: () => writeLine('sturq'),

      about: () => writeLines(fs['about.txt']),

      ls: () => writeLine(Object.keys(fs).join('  ')),

      cat: (args) => {
        const name = (args[0] || '').trim();
        if (!name) return writeLine('usage: cat <file>');
        if (Object.prototype.hasOwnProperty.call(fs, name)) {
          writeLines(fs[name]);
        } else {
          writeLine('cat: ' + name + ': No such file or directory');
        }
      },

      echo: (args) => writeLine(args.join(' ')),

      date: () => writeLine(new Date().toString()),

      uptime: () => {
        const s = Math.floor((performance.now() || 0) / 1000);
        const h = Math.floor(s / 3600);
        const m = Math.floor((s % 3600) / 60);
        const sec = s % 60;
        writeLine('up ' + h + 'h ' + m + 'm ' + sec + 's, 1 user, load avg 0.42, 0.31, 0.27');
      },

      history: () => {
        if (!history.length) return writeLine('(empty)');
        history.forEach((h, i) => writeLine('  ' + String(i + 1).padStart(3, ' ') + '  ' + h));
      },

      neofetch: () => writeLines([
        '        ▄▀▀▀▀▄        sturq@web',
        '       █  ◉ ◉ █       ──────────',
        '       █   ▼  █       Host:   github pages',
        '        ▀▄▄▄▄▀        Kernel: javascript v2026',
        '       /█▓▓▓█\\        Shell:  /bin/fake-sh',
        '      / █▓▓▓█ \\       Uptime: ' + Math.floor((performance.now()||0)/1000) + 's',
        '     ▀▀▀     ▀▀▀',
        '',
        '  ████ ████ ████ ████ ████ ████',
      ]),

      theme: (args) => {
        const name = (args[0] || '').trim().toLowerCase();
        if (!name) return writeLine('usage: theme <' + ALLOWED_THEMES.join('|') + '>');
        if (ALLOWED_THEMES.indexOf(name) === -1) {
          return writeLine('theme: unknown theme: ' + name);
        }
        document.body.setAttribute('data-theme', name);
        writeLine('theme set to ' + name);
      },

      clear: () => { $output.textContent = ''; },

      banner: () => printBanner(),

      exit: () => writeLines([
        'you cannot leave.',
        '(close the tab, i guess?)',
      ]),
    };

    /* ---- input handling ---- */
    function setInputText(s) {
      buffer = s.slice(0, MAX_INPUT);
      $inputText.textContent = buffer;
      scrollDown();
    }

    function commitLine(line) {
      const echo = document.createElement('div');
      echo.className = 'line echo';
      const p = document.createElement('span');
      p.className = 'prompt';
      p.textContent = $prompt.textContent;
      const t = document.createElement('span');
      t.textContent = line;
      echo.appendChild(p);
      echo.appendChild(t);
      $output.appendChild(echo);
    }

    function parse(line) {
      const trimmed = line.trim();
      if (!trimmed) return null;
      const parts = trimmed.split(/\s+/);
      const cmd  = parts[0].toLowerCase();
      const args = parts.slice(1);
      return { cmd, args };
    }

    function run(line) {
      commitLine(line);
      const parsed = parse(line);
      if (!parsed) return;
      if (history[history.length - 1] !== line.trim()) {
        history.push(line.trim());
        if (history.length > MAX_HISTORY) history.shift();
      }
      const fn = Object.prototype.hasOwnProperty.call(commands, parsed.cmd) ? commands[parsed.cmd] : null;
      if (fn) {
        try { fn(parsed.args); }
        catch (e) { writeLine('error: ' + (e && e.message ? e.message : 'unknown')); }
      } else {
        writeLine(parsed.cmd + ': command not found. type "help".');
      }
    }

    function focusHidden() {
      if (busy) return;
      $hidden.focus({ preventScroll: true });
    }

    $term.addEventListener('mousedown', e => {
      e.preventDefault();
      focusHidden();
    });
    $term.addEventListener('touchstart', e => {
      focusHidden();
    }, { passive: true });
    window.addEventListener('load', focusHidden);

    $hidden.addEventListener('input', e => {
      setInputText($hidden.value);
    });

    $hidden.addEventListener('keydown', e => {
      if (busy) { e.preventDefault(); return; }
      if (e.key === 'Enter') {
        e.preventDefault();
        const line = buffer;
        $hidden.value = '';
        setInputText('');
        histIdx = -1;
        run(line);
        scrollDown();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (!history.length) return;
        if (histIdx === -1) histIdx = history.length - 1;
        else if (histIdx > 0) histIdx--;
        $hidden.value = history[histIdx] || '';
        setInputText($hidden.value);
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx === -1) return;
        if (histIdx < history.length - 1) {
          histIdx++;
          $hidden.value = history[histIdx];
        } else {
          histIdx = -1;
          $hidden.value = '';
        }
        setInputText($hidden.value);
      } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        commands.clear();
      } else if (e.key === 'c' && e.ctrlKey) {
        e.preventDefault();
        commitLine(buffer + '^C');
        $hidden.value = '';
        setInputText('');
      }
    });

    /* ---- boot sequence (safe, no user data) ---- */
    const BANNER_WIDE = [
      '',
      '   ____  _____ _   _ ____   ___  ',
      '  / ___||_   _| | | |  _ \\ / _ \\ ',
      '  \\___ \\  | | | | | | |_) | | | |',
      '   ___) | | | | |_| |  _ <| |_| |',
      '  |____/  |_|  \\___/|_| \\_\\\\__\\_\\',
      '',
      '         welcome // type `help`',
      '',
    ];

    const BANNER_NARROW = [
      '',
      '  ┌─────────┐',
      '  │  sturq  │',
      '  └─────────┘',
      '',
      '  welcome',
      '  type `help`',
      '',
    ];

    function printBanner() {
      const narrow = window.innerWidth < 560;
      writeLines(narrow ? BANNER_NARROW : BANNER_WIDE);
    }

    async function boot() {
      busy = true;
      const seq = [
        ['[ ok ] starting kernel...', 220],
        ['[ ok ] mounting / read-only (it\'s static, after all)', 240],
        ['[ ok ] loading /etc/aesthetics', 220],
        ['[ ok ] enabling phosphor.glow', 200],
        ['[ ok ] starting tty1', 220],
        ['', 120],
      ];
      for (const [text, delay] of seq) {
        writeLine(text, 'boot');
        scrollDown();
        await sleep(delay);
      }
      printBanner();
      busy = false;
      scrollDown();
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    boot();
  })();
  </script>
</body>
</html>
