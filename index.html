<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<meta name="theme-color" content="#2A3042">
<meta name="description" content="sturq — quiet machines for the late hours">
<link rel="preload" href="/assets/fonts/CormorantGaramond-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/CormorantGaramond-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
  <filter id="glass-distort" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="55" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<nav class="top">
  <a class="logo" href="/">
    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="currentColor"/>
    </svg>
    <span>sturq</span>
  </a>
  <div class="links">
    <a href="/projects/">projects</a>
  </div>
</nav>

<section class="hero">

  <!-- liquid-glass classical scene: doric columns + pediment -->
  <div class="hero-scene" aria-hidden="true">
    <svg class="scene-wide" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
          <stop offset="18%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.32"/>
          <stop offset="82%"  stop-color="#FFFFFF" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="glassEdgeL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
          <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="glassEdgeR" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="capStone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.7"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
        </linearGradient>
        <linearGradient id="pedGloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.8"/>
          <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <filter id="colBlur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
      </defs>

      <!-- pediment + architrave -->
      <g filter="url(#colBlur)">
        <polygon points="400,200 800,120 1200,200" fill="url(#pedGloss)" opacity="0.85"/>
        <polygon points="400,200 800,120 1200,200" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.4"/>
        <rect x="380" y="200" width="840" height="28" rx="3" fill="url(#pedGloss)" opacity="0.85"/>
        <rect x="380" y="200" width="840" height="1.2" fill="#FFFFFF" opacity="0.7"/>
        <rect x="380" y="226.8" width="840" height="1.2" fill="#B9C5EE" opacity="0.45"/>
      </g>

      <!-- columns: body + caps + edge highlights (clustered central layout) -->
      <g filter="url(#colBlur)">
        <!-- col 1 (left corner) at x=410 -->
        <rect x="410" y="228" width="60" height="528" rx="3" fill="url(#glassBody)"/>
        <rect x="410" y="228" width="20" height="528" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="450" y="228" width="20" height="528" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="410" y="228" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="410" y="754.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="405" y="228" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="405" y="228" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="405" y="754" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="405" y="754" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>

        <!-- col 2 at x=620 -->
        <rect x="620" y="240" width="60" height="516" rx="3" fill="url(#glassBody)"/>
        <rect x="620" y="240" width="20" height="516" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="660" y="240" width="20" height="516" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="620" y="240" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="620" y="754.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="615" y="240" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="615" y="240" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="615" y="754" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="615" y="754" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>

        <!-- col 3 at x=920 -->
        <rect x="920" y="240" width="60" height="516" rx="3" fill="url(#glassBody)"/>
        <rect x="920" y="240" width="20" height="516" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="960" y="240" width="20" height="516" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="920" y="240" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="920" y="754.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="915" y="240" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="915" y="240" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="915" y="754" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="915" y="754" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>

        <!-- col 4 (right corner) at x=1130 -->
        <rect x="1130" y="228" width="60" height="528" rx="3" fill="url(#glassBody)"/>
        <rect x="1130" y="228" width="20" height="528" fill="url(#glassEdgeL)" opacity="0.9"/>
        <rect x="1170" y="228" width="20" height="528" fill="url(#glassEdgeR)" opacity="0.9"/>
        <rect x="1130" y="228" width="60" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="1130" y="754.5" width="60" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="1125" y="228" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="1125" y="228" width="70" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="1125" y="754" width="70" height="14" rx="3" fill="url(#capStone)"/>
        <rect x="1125" y="754" width="70" height="1.2" fill="#FFFFFF" opacity="0.55"/>
      </g>

      <!-- horizon stairs (glass plinth) -->
      <g>
        <rect x="0" y="780" width="1600" height="6" fill="#B9C5EE" opacity="0.45"/>
        <rect x="0" y="780" width="1600" height="1" fill="#FFFFFF" opacity="0.55"/>
        <rect x="0" y="795" width="1600" height="6" fill="#B9C5EE" opacity="0.4"/>
        <rect x="0" y="795" width="1600" height="1" fill="#FFFFFF" opacity="0.45"/>
        <rect x="0" y="810" width="1600" height="6" fill="#B9C5EE" opacity="0.35"/>
        <rect x="0" y="810" width="1600" height="1" fill="#FFFFFF" opacity="0.35"/>
        <rect x="0" y="825" width="1600" height="6" fill="#B9C5EE" opacity="0.3"/>
        <rect x="0" y="840" width="1600" height="6" fill="#B9C5EE" opacity="0.25"/>
      </g>
    </svg>

    <!-- portrait variant: 2 close-up columns + pediment, designed for tall viewports -->
    <svg class="scene-portrait" viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
      <defs>
        <linearGradient id="glassBodyP" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
          <stop offset="18%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.32"/>
          <stop offset="82%"  stop-color="#FFFFFF" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="glassEdgeLP" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
          <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="glassEdgeRP" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="capStoneP" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.7"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
        </linearGradient>
        <linearGradient id="pedGlossP" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.8"/>
          <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <filter id="colBlurP" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
      </defs>

      <!-- pediment + architrave -->
      <g filter="url(#colBlurP)">
        <polygon points="60,100 300,30 540,100" fill="url(#pedGlossP)" opacity="0.85"/>
        <polygon points="60,100 300,30 540,100" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.4"/>
        <rect x="50" y="100" width="500" height="24" rx="3" fill="url(#pedGlossP)" opacity="0.85"/>
        <rect x="50" y="100" width="500" height="1.2" fill="#FFFFFF" opacity="0.7"/>
        <rect x="50" y="122.8" width="500" height="1.2" fill="#B9C5EE" opacity="0.45"/>
      </g>

      <!-- 2 close-up columns -->
      <g filter="url(#colBlurP)">
        <!-- left column -->
        <rect x="140" y="124" width="84" height="690" rx="3" fill="url(#glassBodyP)"/>
        <rect x="140" y="124" width="28" height="690" fill="url(#glassEdgeLP)" opacity="0.9"/>
        <rect x="196" y="124" width="28" height="690" fill="url(#glassEdgeRP)" opacity="0.9"/>
        <rect x="140" y="124" width="84" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="140" y="812.5" width="84" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="132" y="124" width="100" height="16" rx="3" fill="url(#capStoneP)"/>
        <rect x="132" y="124" width="100" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="132" y="812" width="100" height="16" rx="3" fill="url(#capStoneP)"/>
        <rect x="132" y="812" width="100" height="1.2" fill="#FFFFFF" opacity="0.55"/>

        <!-- right column -->
        <rect x="376" y="124" width="84" height="690" rx="3" fill="url(#glassBodyP)"/>
        <rect x="376" y="124" width="28" height="690" fill="url(#glassEdgeLP)" opacity="0.9"/>
        <rect x="432" y="124" width="28" height="690" fill="url(#glassEdgeRP)" opacity="0.9"/>
        <rect x="376" y="124" width="84" height="1.5" fill="#FFFFFF" opacity="0.75"/>
        <rect x="376" y="812.5" width="84" height="1.5" fill="#FFFFFF" opacity="0.4"/>
        <rect x="368" y="124" width="100" height="16" rx="3" fill="url(#capStoneP)"/>
        <rect x="368" y="124" width="100" height="1.2" fill="#FFFFFF" opacity="0.85"/>
        <rect x="368" y="812" width="100" height="16" rx="3" fill="url(#capStoneP)"/>
        <rect x="368" y="812" width="100" height="1.2" fill="#FFFFFF" opacity="0.55"/>
      </g>

      <!-- plinth stairs -->
      <g>
        <rect x="0" y="830" width="600" height="6" fill="#B9C5EE" opacity="0.45"/>
        <rect x="0" y="830" width="600" height="1" fill="#FFFFFF" opacity="0.55"/>
        <rect x="0" y="845" width="600" height="6" fill="#B9C5EE" opacity="0.4"/>
        <rect x="0" y="845" width="600" height="1" fill="#FFFFFF" opacity="0.45"/>
        <rect x="0" y="860" width="600" height="6" fill="#B9C5EE" opacity="0.35"/>
        <rect x="0" y="875" width="600" height="6" fill="#B9C5EE" opacity="0.3"/>
      </g>
    </svg>
  </div>

  <!-- center geometric lambda -->
  <div class="bust-wrap" aria-hidden="true">
    <svg class="bust" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lamGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.7"/>
        </linearGradient>
      </defs>
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="url(#lamGrad)"/>
    </svg>
  </div>

  <h1>sturq</h1>
  <p class="tagline">quiet machines for the late hours</p>
</section>

<section class="manifesto reveal">
  <blockquote>
    in the silence between requests, the machine dreams of marble and city rain.

</svg>
