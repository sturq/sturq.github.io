<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sturq</title>
<meta name="theme-color" content="#2e3440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,200..700&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true">
    <span class="bubble b1"></span>
    <span class="bubble b2"></span>
    <span class="bubble b3"></span>
    <span class="bubble b4"></span>
    <span class="bubble b5"></span>
    <span class="bubble b6"></span>
    <span class="bubble b7"></span>
    <span class="bubble b8"></span>
    <span class="bubble b9"></span>
  </div>

  <main>
    <div class="status-chip">
      <span class="status-dot"></span>
      <span>online</span>
    </div>

    <section class="card">
      <div class="card-ring"></div>
      <div class="card-inner">
        <div class="card-label">handle</div>
        <h1 class="name">sturq</h1>
        <div class="divider">
          <span class="divider-dot"></span>
          <span class="divider-dot"></span>
          <span class="divider-dot"></span>
        </div>
        <div class="card-sub">a person on the internet</div>
      </div>
    </section>

    <div class="chip-row">
      <button class="chip chip-primary">
        <span class="chip-icon">✦</span>
        nord
      </button>
      <button class="chip">
        <span class="chip-icon">◉</span>
        material
      </button>
      <button class="chip">
        <span class="chip-icon">⟡</span>
        2026
      </button>
    </div>
  </main>

  <script>
  (function () {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;

    const bubbles = Array.from(document.querySelectorAll('.bubble'));
    if (!bubbles.length) return;

    const state = bubbles.map(el => {
      const r = el.getBoundingClientRect();
      return {
        el,
        cx: r.left + r.width / 2,
        cy: r.top + r.height / 2,
        size: r.width,
        ox: 0, oy: 0,
        vx: 0, vy: 0,
      };
    });

    let pointer = { x: -9999, y: -9999, active: false };

    const recalc = () => {
      state.forEach(b => {
        b.el.style.translate = '';
        const r = b.el.getBoundingClientRect();
        b.cx = r.left + r.width / 2;
        b.cy = r.top + r.height / 2;
        b.size = r.width;
        b.el.style.translate = `${b.ox.toFixed(2)}px ${b.oy.toFixed(2)}px`;
      });
    };
    window.addEventListener('resize', recalc, { passive: true });

    const onMove = (x, y) => {
      pointer.x = x; pointer.y = y; pointer.active = true;
    };
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY), { passive: true });
    window.addEventListener('mouseleave', () => { pointer.active = false; }, { passive: true });
    window.addEventListener('touchmove', e => {
      const t = e.touches[0];
      if (t) onMove(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchstart', e => {
      const t = e.touches[0];
      if (t) onMove(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener('touchend', () => { pointer.active = false; }, { passive: true });

    const tick = () => {
      state.forEach(b => {
        const dx = (b.cx + b.ox) - pointer.x;
        const dy = (b.cy + b.oy) - pointer.y;
        const dist = Math.hypot(dx, dy);
        const radius = b.size * 0.9 + 100;

        let pushX = 0, pushY = 0;
        if (pointer.active && dist < radius && dist > 0.01) {
          const force = (1 - dist / radius);
          const strength = force * force * 110;
          pushX = (dx / dist) * strength;
          pushY = (dy / dist) * strength;
        }

        b.vx += (pushX - b.ox) * 0.07;
        b.vy += (pushY - b.oy) * 0.07;
        b.vx *= 0.85;
        b.vy *= 0.85;
        b.ox += b.vx;
        b.oy += b.vy;

        b.el.style.translate = `${b.ox.toFixed(2)}px ${b.oy.toFixed(2)}px`;
      });
      requestAnimationFrame(tick);
    };

    requestAnimationFrame(() => { recalc(); tick(); });

    /* Chip ripple */
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', e => {
        const rect = chip.getBoundingClientRect();
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.left = (e.clientX - rect.left) + 'px';
        ripple.style.top = (e.clientY - rect.top) + 'px';
        chip.appendChild(ripple);
        setTimeout(() => ripple.remove(), 700);
      });
    });
  })();
  </script>
</body>
</html>
