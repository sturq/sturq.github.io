<style>
  .lost {
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .ruin-scene {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: screen;
    filter:
      drop-shadow(0 14px 36px rgba(0, 0, 0, 0.45))
      drop-shadow(0 2px 6px rgba(185, 197, 238, 0.15))
      contrast(1.05) saturate(1.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ruin-scene svg {
    width: min(85vmin, 900px);
    height: auto;
    display: block;
  }
  .ruin-butterfly {
    transform-origin: 540px 290px;
    animation: butterfly-fly 19s ease-in-out infinite;
  }
  @keyframes butterfly-fly {
    0%   { transform: translate(0, 0) rotate(0deg); }
    10%  { transform: translate(-80px, -52px) rotate(-10deg); }
    22%  { transform: translate(-200px, -22px) rotate(9deg); }
    34%  { transform: translate(-310px, 18px) rotate(-6deg); }
    46%  { transform: translate(-360px, -38px) rotate(11deg); }
    58%  { transform: translate(-260px, 60px) rotate(-7deg); }
    70%  { transform: translate(-110px, 90px) rotate(9deg); }
    82%  { transform: translate(40px, 50px) rotate(-9deg); }
    92%  { transform: translate(90px, -32px) rotate(7deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .ruin-wing-l, .ruin-wing-r {
    transform-origin: 540px 290px;
    animation: wing-flap 0.18s ease-in-out infinite;
  }
  @keyframes wing-flap {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(0.32); }
  }
  .ruin-plant {
    transform-origin: 400px 530px;
    animation: plant-sway 8s ease-in-out infinite;
  }
  @keyframes plant-sway {
    0%, 100% { transform: rotate(-2.5deg); }
    50%      { transform: rotate(3deg); }
  }
  .ruin-plant-b {
    transform-origin: 270px 530px;
    animation: plant-sway-b 11s ease-in-out infinite;
  }
  @keyframes plant-sway-b {
    0%, 100% { transform: rotate(2deg); }
    50%      { transform: rotate(-2.6deg); }
  }
  .ruin-ivy {
    transform-origin: 555px 540px;
    animation: ivy-creep 14s ease-in-out infinite;
  }
  @keyframes ivy-creep {
    0%, 100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1.2deg); }
  }
  .ruin-ants {
    animation: ants-march 24s linear infinite;
  }
  @keyframes ants-march {
    0%   { transform: translateX(-60px); }
    100% { transform: translateX(720px); }
  }
  .ruin-beetle {
    transform-origin: 350px 562px;
    animation: beetle-crawl 32s ease-in-out infinite;
  }
  @keyframes beetle-crawl {
    0%   { transform: translate(0, 0) rotate(0deg); }
    22%  { transform: translate(46px, -6px) rotate(14deg); }
    44%  { transform: translate(92px, 14px) rotate(-6deg); }
    62%  { transform: translate(52px, 28px) rotate(18deg); }
    82%  { transform: translate(-24px, 8px) rotate(-10deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .ruin-snail {
    animation: snail-crawl 95s linear infinite;
  }
  @keyframes snail-crawl {
    0%   { transform: translateX(0); }
    100% { transform: translateX(140px); }
  }
  @media (max-width: 600px) {
    .ruin-scene { opacity: 0.42; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ruin-butterfly, .ruin-wing-l, .ruin-wing-r,
    .ruin-plant, .ruin-plant-b, .ruin-ivy,
    .ruin-ants, .ruin-beetle, .ruin-snail { animation: none !important; }
  }
  .lost-stack { position: relative; z-index: 2; max-width: 640px; }
  .lost h1 {
    font-family: var(--display-font);
    font-weight: 300;
    font-size: clamp(120px, 28vw, 240px);
    letter-spacing: -0.04em;
    line-height: 0.9;
    color: var(--fg);
    text-shadow: 0 0 60px rgba(185, 197, 238, 0.25);
  }
  .lost .greek {
    margin-top: 14px;
    font-family: var(--display-font);
    font-style: normal;
    font-size: 14px;
    letter-spacing: 0.6em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .lost .epitaph {
    margin-top: 32px;
    font-family: var(--display-font);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(20px, 3vw, 26px);
    line-height: 1.45;
    color: var(--muted);
  }
  .lost .home {
    margin-top: 44px;
    display: inline-block;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05)),
      rgba(185, 197, 238, 0.18);
    backdrop-filter: blur(18px) saturate(180%) brightness(115%);
    -webkit-backdrop-filter: blur(18px) saturate(180%) brightness(115%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 12px 34px;
    color: var(--fg);
    font-family: var(--mono-font);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.32),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 8px 22px rgba(0, 0, 0, 0.32);
    transition: transform 0.25s, box-shadow 0.3s, background 0.3s;
  }
  .lost .home:hover {
    transform: translateY(-1px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08)),
      rgba(185, 197, 238, 0.32);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.42),
      0 0 38px var(--accent-glow),
      0 12px 28px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
