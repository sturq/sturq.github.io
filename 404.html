<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · sturq</title>
<meta name="theme-color" content="#2A3042">
<meta name="robots" content="noindex,nofollow">
<link rel="preload" href="/assets/fonts/CormorantGaramond-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/CormorantGaramond-Italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
  .lost {
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .ruin-scene {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: screen;
    filter:
      drop-shadow(0 14px 36px rgba(0, 0, 0, 0.45))
      drop-shadow(0 2px 6px rgba(185, 197, 238, 0.15))
      contrast(1.05) saturate(1.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ruin-scene svg {
    width: min(85vmin, 900px);
    height: auto;
    display: block;
  }
  .ruin-butterfly {
    transform-origin: 460px 380px;
    animation: butterfly-fly 17s ease-in-out infinite;
  }
  @keyframes butterfly-fly {
    0%   { transform: translate(0, 0) rotate(0deg); }
    14%  { transform: translate(-80px, -40px) rotate(-9deg); }
    28%  { transform: translate(-200px, 0) rotate(8deg); }
    42%  { transform: translate(-260px, -50px) rotate(-7deg); }
    58%  { transform: translate(-160px, 40px) rotate(10deg); }
    72%  { transform: translate(-40px, -20px) rotate(-8deg); }
    86%  { transform: translate(60px, -50px) rotate(7deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .ruin-wing-l, .ruin-wing-r {
    transform-origin: 460px 380px;
    animation: wing-flap 0.2s ease-in-out infinite;
  }
  @keyframes wing-flap {
    0%, 100% { transform: scaleX(1); }
    50%      { transform: scaleX(0.34); }
  }
  .ruin-grass {
    transform-origin: 400px 600px;
    animation: grass-sway 6s ease-in-out infinite;
  }
  @keyframes grass-sway {
    0%, 100% { transform: rotate(-1.8deg); }
    50%      { transform: rotate(2deg); }
  }
  @media (max-width: 600px) {
    .ruin-scene { opacity: 0.45; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ruin-butterfly, .ruin-wing-l, .ruin-wing-r, .ruin-grass { animation: none !important; }
  }
  .lost-stack { position: relative; z-index: 2; max-width: 640px; }
  .lost h1 {
    font-family: var(--display-font);
    font-weight: 300;
    font-size: clamp(120px, 28vw, 240px);
    letter-spacing: -0.04em;
    line-height: 0.9;
    color: var(--fg);
    text-shadow: 0 0 60px rgba(185, 197, 238, 0.25);
  }
  .lost .greek {
    margin-top: 14px;
    font-family: var(--display-font);
    font-style: normal;
    font-size: 14px;
    letter-spacing: 0.6em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .lost .epitaph {
    margin-top: 32px;
    font-family: var(--display-font);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(20px, 3vw, 26px);
    line-height: 1.45;
    color: var(--muted);
  }
  .lost .home {
    margin-top: 44px;
    display: inline-block;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05)),
      rgba(185, 197, 238, 0.18);
    backdrop-filter: blur(18px) saturate(180%) brightness(115%);
    -webkit-backdrop-filter: blur(18px) saturate(180%) brightness(115%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 12px 34px;
    color: var(--fg);
    font-family: var(--mono-font);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.32),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 8px 22px rgba(0, 0, 0, 0.32);
    transition: transform 0.25s, box-shadow 0.3s, background 0.3s;
  }
  .lost .home:hover {
    transform: translateY(-1px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08)),
      rgba(185, 197, 238, 0.32);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.42),
      0 0 38px var(--accent-glow),
      0 12px 28px rgba(0, 0, 0, 0.4);
  }
</style>
</head>
<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
  <filter id="glass-distort" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="55" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<nav class="top">
  <a class="logo" href="/">
    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="currentColor"/>
    </svg>
    <span>sturq</span>
  </a>
  <div class="links">
    <a href="/">home</a>
    <a href="/projects/">projects</a>
  </div>
</nav>

<main class="lost">

  <!-- liquid-glass broken column / ruin scene -->
  <div class="ruin-scene" aria-hidden="true">
    <svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="rGlassBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.55"/>
          <stop offset="18%"  stop-color="#FFFFFF" stop-opacity="0.18"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.32"/>
          <stop offset="82%"  stop-color="#FFFFFF" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="rGlassEdgeL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.85"/>
          <stop offset="40%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="rGlassEdgeR" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
          <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0.1"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.55"/>
        </linearGradient>
        <linearGradient id="rCapStone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.7"/>
          <stop offset="50%"  stop-color="#B9C5EE" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
        </linearGradient>
        <linearGradient id="rLeaf" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#b8d0b3" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#6e8a73" stop-opacity="0.65"/>
        </linearGradient>
        <linearGradient id="rStem" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#a5bfa0" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#7d9c7c" stop-opacity="0.85"/>
        </linearGradient>
        <radialGradient id="rWing" cx="40%" cy="35%" r="70%">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
          <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#B9C5EE" stop-opacity="0.18"/>
        </radialGradient>
        <radialGradient id="rShell" cx="38%" cy="32%" r="80%">
          <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.7"/>
          <stop offset="55%"  stop-color="#B9C5EE" stop-opacity="0.45"/>
          <stop offset="100%" stop-color="#404661" stop-opacity="0.55"/>
        </radialGradient>
        <filter id="rBlur" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="0.6"/>
        </filter>
      </defs>

      <!-- simple ground line -->
      <line x1="120" y1="600" x2="680" y2="600" stroke="#B9C5EE" stroke-opacity="0.35" stroke-width="1"/>

      <!-- simple broken column -->
      <g>
        <rect x="370" y="360" width="60" height="240" fill="url(#rGlassBody)"/>
        <polygon points="370,360 380,346 390,354 400,338 410,352 420,344 430,360" fill="url(#rGlassBody)"/>
        <polyline points="370,360 380,346 390,354 400,338 410,352 420,344 430,360"
                  fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1"/>
      </g>

      <!-- a few small scattered stones on the ground -->
      <g fill="#B9C5EE" opacity="0.45">
        <ellipse cx="220" cy="601" rx="6" ry="2"/>
        <ellipse cx="600" cy="602" rx="7" ry="2.4"/>
        <ellipse cx="640" cy="601" rx="4" ry="1.6"/>
      </g>

      <!-- grass tuft at the base of the column: one wavy silhouette -->
      <g class="ruin-grass">
        <path d="M 300 600
                 Q 310 580 320 600
                 Q 332 575 344 600
                 Q 356 582 368 600
                 Q 380 572 392 600
                 Q 404 580 416 600
                 Q 428 575 440 600
                 Q 452 582 464 600
                 Q 476 578 488 600
                 Q 500 585 510 600 Z"
              fill="#8fb295" opacity="0.78"/>
      </g>

      <!-- tiny butterfly: dot + 2 small wings -->
      <g class="ruin-butterfly">
        <circle cx="460" cy="380" r="2" fill="#FFFFFF" opacity="0.92"/>
        <g class="ruin-wing-r">
          <ellipse cx="466" cy="378" rx="5" ry="3" fill="#B9C5EE" opacity="0.78"/>
        </g>
        <g class="ruin-wing-l">
          <ellipse cx="454" cy="378" rx="5" ry="3" fill="#B9C5EE" opacity="0.78"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="lost-stack">
    <h1>404</h1>
    <div class="greek">ΤΑ ΕΡΕΙΠΙΑ</div>
    <p class="epitaph">this column is missing from the colonnade.</p>
    <a class="home" href="/">return</a>
  </div>
</main>

</body>
</html>
