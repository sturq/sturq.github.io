<meta name="robots" content="noindex,nofollow">
<link rel="preload" href="/assets/fonts/CormorantGaramond-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<style>
  .gate-wrap {
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
  }
  .internal-scene {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220vmax;
    height: 220vmax;
    pointer-events: none;
    z-index: 0;
    opacity: 0.28;
    mix-blend-mode: screen;
    filter: contrast(1.1);
    transform-origin: 50% 50%;
    animation: mech-rotate 240s linear infinite;
  }
  .internal-scene svg { width: 100%; height: 100%; display: block; }
  @keyframes mech-rotate {
    0%   { transform: translate(-50%, -50%) rotate(0deg); }
    100% { transform: translate(-50%, -50%) rotate(-360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .internal-scene { animation: none; }
  }
  #gate, #content { position: relative; z-index: 2; }
  .gate-wrap h1 {
    font-family: var(--display-font);
    font-weight: 300;
    font-size: clamp(72px, 16vw, 144px);
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--fg);
    text-shadow: 0 0 50px rgba(185, 197, 238, 0.25);
  }
  .gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 36px;
  }
  .gate input {
    background: rgba(23, 26, 34, 0.6);
    border: 1px solid var(--accent-soft);
    border-radius: 2px;
    padding: 12px 18px;
    color: var(--fg);
    font-family: var(--mono-font);
    font-size: 13px;
    letter-spacing: 0.15em;
    width: 240px;
    text-align: center;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .gate input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 24px var(--accent-soft);
  }
  .gate button {
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 2px;
    padding: 10px 28px;
    color: var(--accent);
    font-family: var(--mono-font);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.25s, color 0.25s, box-shadow 0.25s;
  }
  .gate button:hover:not(:disabled) {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 24px var(--accent-glow);
  }
  .gate button:disabled { opacity: 0.5; cursor: wait; }
  .err {
    color: #EEB9BD;
    font-family: var(--mono-font);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    min-height: 18px;
  }
  #content { display: none; text-align: center; }
  #content #logout {
    margin-top: 36px;
    background: transparent;
    border: 1px solid rgba(238, 185, 189, 0.4);
    color: #EEB9BD;
    border-radius: 2px;
    padding: 8px 22px;
    font-family: var(--mono-font);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
  }
  #content #logout:hover {
    background: rgba(238, 185, 189, 0.1);
  }
</style>
<script src="argon2.js"></script>

<script>
const BLOB = {"salt":"Bx5T3r0eizTbpKAZffoP/A==","iv":"3AecDIg5Fg0bMdL0","ct":"UC2t747V3aioFwK0Tt1PaDMhzYYhNt6ZdSJfOI3zUYDjZJ6kljSiMpI00nx/kE15VKI+DbUM749KkGEs8CxWbBicH0beHsBvLlApNO43zvKiBkfskpsqTRVzb65GgfnULFIXzXWvLzbDNqbcnGZW","kdf":"argon2id","parallelism":1,"iterations":3,"memorySize":65536,"hashLength":32};

const b64ToBytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(password) {
  const salt = b64ToBytes(BLOB.salt);
  const iv = b64ToBytes(BLOB.iv);
  const ct = b64ToBytes(BLOB.ct);

  const rawKey = await hashwasm.argon2id({
    password,
    salt,
    parallelism: BLOB.parallelism,
    iterations: BLOB.iterations,
    memorySize: BLOB.memorySize,
    hashLength: BLOB.hashLength,
    outputType: 'binary',
  });

  const key = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(pt);
}

const STORAGE_KEY = 'internal_blob_v2';
const DB_NAME = 'internal';
const STORE = 'keys';
const KEY_ID = 'wrap';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const r = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbPut(key, val) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const r = db.transaction(STORE, 'readwrite').objectStore(STORE).put(val, key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
async function idbDel(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const r = db.transaction(STORE, 'readwrite').objectStore(STORE).delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

const bytesToB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));

async function persistContent(html) {
  const key = await crypto.subtle.generateKey(
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
  await idbPut(KEY_ID, key);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    new TextEncoder().encode(html)
  );
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ iv: bytesToB64(iv), ct: bytesToB64(ct) }));
}

async function restoreContent() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    const { iv, ct } = JSON.parse(raw);
    const key = await idbGet(KEY_ID);
    if (!key) return null;
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(iv) },
      key,
      b64ToBytes(ct)
    );
    return new TextDecoder().decode(pt);
  } catch {
    return null;
  }
}

async function clearPersisted() {
  localStorage.removeItem(STORAGE_KEY);
  try { await idbDel(KEY_ID); } catch {}
}

function unlock(html) {
  document.getElementById('gate').style.display = 'none';
  const content = document.getElementById('content');
  content.innerHTML = html + '<button id="logout">lock</button>';
  content.style.display = 'block';
  document.getElementById('logout').addEventListener('click', async () => {
    await clearPersisted();
    location.reload();
  });
}

(async () => {
  const restored = await restoreContent();
  if (restored) unlock(restored);
})();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.querySelector('.gate button');
  const input = document.getElementById('pw');
  err.textContent = '';
  btn.disabled = true;
  input.disabled = true;
  btn.textContent = 'decrypting…';
  try {
    const html = await decrypt(pw);
    await persistContent(html);
    unlock(html);
  } catch {
    err.textContent = 'wrong password';
    btn.disabled = false;
    input.disabled = false;
    btn.textContent = 'enter';
    input.focus();
    input.select();
  }
});
</script>
