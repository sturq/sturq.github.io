<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  .gate-wrap {
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
  }
  .orbs {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%,
        rgba(255, 255, 255, 0.55) 0%,
        rgba(255, 255, 255, 0.18) 22%,
        rgba(185, 197, 238, 0.32) 60%,
        rgba(185, 197, 238, 0.55) 100%);
    box-shadow:
      inset 0 2px 6px rgba(255, 255, 255, 0.4),
      inset 0 -2px 6px rgba(185, 197, 238, 0.4),
      0 12px 40px rgba(0, 0, 0, 0.35),
      0 2px 10px rgba(185, 197, 238, 0.2);
    backdrop-filter: blur(8px) saturate(160%);
    -webkit-backdrop-filter: blur(8px) saturate(160%);
    opacity: 0.7;
  }
  .orb::before {
    content: "";
    position: absolute;
    top: 8%;
    left: 14%;
    width: 42%;
    height: 28%;
    border-radius: 50%;
    background: radial-gradient(ellipse,
      rgba(255, 255, 255, 0.7) 0%,
      rgba(255, 255, 255, 0.15) 60%,
      transparent 100%);
    transform: rotate(-22deg);
    filter: blur(2px);
  }
  .orb.a { width: 180px; height: 180px; top: 12%; left: 8%;  animation: drift-a 22s ease-in-out infinite; }
  .orb.b { width: 110px; height: 110px; top: 68%; left: 12%; animation: drift-b 28s ease-in-out infinite; }
  .orb.c { width: 220px; height: 220px; top: 18%; right: 10%; animation: drift-c 32s ease-in-out infinite; }
  .orb.d { width: 90px;  height: 90px;  top: 74%; right: 16%; animation: drift-d 26s ease-in-out infinite; }
  .orb.e { width: 60px;  height: 60px;  top: 46%; left: 18%; animation: drift-e 19s ease-in-out infinite; opacity: 0.55; }
  .orb.f { width: 70px;  height: 70px;  top: 32%; right: 22%; animation: drift-f 24s ease-in-out infinite; opacity: 0.55; }
  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, -30px) scale(1.04); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-25px, -40px) scale(1.06); }
  }
  @keyframes drift-c {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(-35px, 40px) scale(0.96); }
  }
  @keyframes drift-d {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(30px, -25px) scale(1.05); }
  }
  @keyframes drift-e {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(20px, 35px); }
  }
  @keyframes drift-f {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(-30px, 25px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .orb { animation: none !important; }
  }
  @media (max-width: 600px) {
    .orb.a { width: 130px; height: 130px; }
    .orb.b { width: 80px;  height: 80px; }
    .orb.c { width: 150px; height: 150px; }
    .orb.d { width: 70px;  height: 70px; }
    .orb.e, .orb.f { display: none; }
  }
  #gate, #content { position: relative; z-index: 2; }
  .seal-label {
    margin-top: 24px;
    font-family: var(--mono-font);
    font-size: 10px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: center;
  }
  .seal-label::before, .seal-label::after {
    content: "·";
    margin: 0 10px;
    color: var(--accent);
  }
  .gate-wrap h1 {
    font-family: var(--display-font);
    font-weight: 300;
    font-size: clamp(72px, 16vw, 144px);
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--fg);
    text-shadow: 0 0 50px rgba(185, 197, 238, 0.25);
  }
  .gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 36px;
  }
  .gate input {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
      rgba(42, 48, 66, 0.3);
    backdrop-filter: blur(18px) saturate(170%) brightness(108%);
    -webkit-backdrop-filter: blur(18px) saturate(170%) brightness(108%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 14px 22px;
    color: var(--fg);
    font-family: var(--mono-font);
    font-size: 13px;
    letter-spacing: 0.15em;
    width: 260px;
    text-align: center;
    outline: none;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.22),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 6px 22px rgba(0, 0, 0, 0.28);
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .gate input:focus {
    border-color: rgba(185, 197, 238, 0.55);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      0 0 32px var(--accent-soft),
      0 6px 22px rgba(0, 0, 0, 0.32);
  }
  .gate button {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.05)),
      rgba(185, 197, 238, 0.18);
    backdrop-filter: blur(18px) saturate(180%) brightness(115%);
    -webkit-backdrop-filter: blur(18px) saturate(180%) brightness(115%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 12px 34px;
    color: var(--fg);
    font-family: var(--mono-font);
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.32),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 8px 22px rgba(0, 0, 0, 0.32);
    transition: transform 0.25s, box-shadow 0.3s, background 0.3s;
  }
  .gate button:hover:not(:disabled) {
    transform: translateY(-1px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.08)),
      rgba(185, 197, 238, 0.32);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.42),
      0 0 38px var(--accent-glow),
      0 12px 28px rgba(0, 0, 0, 0.4);
  }
  .gate button:disabled { opacity: 0.5; cursor: wait; }
  .err {
    color: #EEB9BD;
    font-family: var(--mono-font);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    min-height: 18px;
  }
  #content { display: none; text-align: center; }
  #content #logout {
    margin-top: 36px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03)),
      rgba(238, 185, 189, 0.16);
    backdrop-filter: blur(18px) saturate(170%) brightness(112%);
    -webkit-backdrop-filter: blur(18px) saturate(170%) brightness(112%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #FFE3E5;
    border-radius: 999px;
    padding: 10px 26px;
    font-family: var(--mono-font);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.28),
      inset 0 -1px 0 rgba(255, 255, 255, 0.04),
      0 6px 18px rgba(0, 0, 0, 0.32);
    transition: transform 0.25s, background 0.3s, box-shadow 0.3s;
  }
  #content #logout:hover {
    transform: translateY(-1px);
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.06)),
      rgba(238, 185, 189, 0.28);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.38),
      0 0 32px rgba(238, 185, 189, 0.4),
      0 12px 26px rgba(0, 0, 0, 0.4);
  }
</style>
<script src="argon2.js"></script>

<body>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" focusable="false">
  <filter id="glass-distort" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1" result="softNoise"/>

<nav class="top">

    <svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <polygon points="32,0 48,0 95,120 79,120 58,65 22,120 4,120 51,48" fill="currentColor"/>
    </svg>

  </a>

<main class="gate-wrap">

  <!-- iOS 26 drifting glass orbs -->
  <div class="orbs" aria-hidden="true">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
    <div class="orb d"></div>
    <div class="orb e"></div>
    <div class="orb f"></div>
  </div>


  <div id="gate">
    <h1>internal</h1>
    <form class="gate" id="form" autocomplete="off">
      <input id="pw" type="password" placeholder="password" autofocus>
      <button type="submit">enter</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <div id="content"></div>
</main>

<script>
// Each blob is decrypted with its own password. First match wins.
// Add new entries via: node .encrypt.js "PASSWORD" "<html>"  →  paste result.
const BLOBS = [
  {"salt":"6oz47NlEEdyUPQ9O0NQUCA==","iv":"KZOe3OawnSjNmwyD","ct":"7gP4tuveMItsDRPKUq0gZlpdD8mA5WgQO0tB+e/lxCpevITti+B4asaAwS7agmjF8njMAanAb9jZVKQXBqd3V8qA+5NyczAQmwjAT8DtxX0635dTigBeqfz0YAHel0qKu2S0N3mkEPxXJv+C/pjApIV60IRjphe9PY14bsm6M7fKZFVbHG+Jmb0N6WW3HaPoKuJhjrZfO1qXBoakM0N+NLJDaKCeCWlDpIr+6XoCievtU8tQ3je+I+V9PYdeAw==","kdf":"argon2id","parallelism":1,"iterations":4,"memorySize":98304,"hashLength":32},
  {"salt":"fse8chz6dsSBh41hh2tGHg==","iv":"ZHhl7/hLWWmzX5+N","ct":"bR4Yjcta7FQn1efAs/ok2qigonxe9eWSJaHA2E0Oe+6Y4SmYXTqjlfU7bpx7rY8SRQqv9sT7TUa1+sAReNMmkywx5eewomKRmPUxkQnovDsVUwZYt0r7ijll/wVX/dEh9HF7mEnhCW5BApTN6UTau5Nb8xdg3/ghQxAGv4CqCsEmrmq4Vss9HEDtnkHVXu4lYq2gCDY87tnLn0DtlVEyiHxT7RWdxf8Wtgr2jn6J87kmQrlp1v6AVYRCL+YuMuk=","kdf":"argon2id","parallelism":1,"iterations":4,"memorySize":98304,"hashLength":32}
];

const b64ToBytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function tryBlob(blob, password) {
  const salt = b64ToBytes(blob.salt);
  const iv = b64ToBytes(blob.iv);
  const ct = b64ToBytes(blob.ct);
  const rawKey = await hashwasm.argon2id({
    password, salt,
    parallelism: blob.parallelism,
    iterations: blob.iterations,
    memorySize: blob.memorySize,
    hashLength: blob.hashLength,
    outputType: 'binary',
  });
  const key = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(pt);
}

async function decrypt(password) {
  for (const blob of BLOBS) {
    try {
      return await tryBlob(blob, password);
    } catch { /* wrong password for this blob, try next */ }
  }
  throw new Error('no blob matched');
}

const STORAGE_KEY = 'internal_blob_v4';
const DB_NAME = 'internal';
const STORE = 'keys';
const KEY_ID = 'wrap';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const r = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
    r.onsuccess = () => resolve(r.result || null);
    r.onerror = () => reject(r.error);
  });
}
async function idbPut(key, val) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const r = db.transaction(STORE, 'readwrite').objectStore(STORE).put(val, key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}
async function idbDel(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const r = db.transaction(STORE, 'readwrite').objectStore(STORE).delete(key);
    r.onsuccess = () => resolve();
    r.onerror = () => reject(r.error);
  });
}

const bytesToB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));

async function persistContent(html) {
  const key = await crypto.subtle.generateKey(
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
  await idbPut(KEY_ID, key);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv },
    key,
    new TextEncoder().encode(html)
  );
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ iv: bytesToB64(iv), ct: bytesToB64(ct) }));
}

async function restoreContent() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return null;
  try {
    const { iv, ct } = JSON.parse(raw);
    const key = await idbGet(KEY_ID);
    if (!key) return null;
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: b64ToBytes(iv) },
      key,
      b64ToBytes(ct)
    );
    return new TextDecoder().decode(pt);
  } catch {
    return null;
  }
}

async function clearPersisted() {
  localStorage.removeItem(STORAGE_KEY);
  try { await idbDel(KEY_ID); } catch {}
}

function unlock(html) {
  document.getElementById('gate').style.display = 'none';
  const content = document.getElementById('content');
  content.innerHTML = html + '<button id="logout">lock</button>';
  content.style.display = 'block';
  document.getElementById('logout').addEventListener('click', async () => {
    await clearPersisted();
    location.reload();
  });
}

function triggerFileDownload(name, mime, b64data) {
  const bin = atob(b64data);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name || 'file';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  // tiny inline indicator
  document.getElementById('gate').style.display = 'none';
  const content = document.getElementById('content');
  const safeName = String(name || 'file').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
  content.innerHTML =
    '<h1 style="font-family:var(--display-font);font-weight:400;font-size:clamp(48px,10vw,84px);line-height:1;color:var(--fg);text-shadow:0 0 50px rgba(185,197,238,0.3);">downloaded</h1>' +
    '<p style="margin-top:14px;font-family:var(--mono-font);font-size:12px;letter-spacing:0.25em;text-transform:uppercase;color:var(--dim);">' + safeName + '</p>' +
    '<button id="logout">lock</button>';
  content.style.display = 'block';
  document.getElementById('logout').addEventListener('click', () => location.reload());
}

// dispatch plaintext: new JSON format ({k:"h",v:...} or {k:"f",n,m,d}) or legacy plain HTML
function dispatch(plaintext, opts) {
  let obj = null;
  if (plaintext.charCodeAt(0) === 123 /* '{' */) {
    try { obj = JSON.parse(plaintext); } catch {}
  }
  if (obj && obj.k === 'f') {
    triggerFileDownload(obj.n, obj.m, obj.d);
    return; // don't persist files
  }
  const html = obj && obj.k === 'h' ? obj.v : plaintext;
  if (opts && opts.persist) persistContent(html);
  unlock(html);
}

(async () => {
  const restored = await restoreContent();
  if (restored) unlock(restored);
})();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.querySelector('.gate button');
  const input = document.getElementById('pw');
  err.textContent = '';
  btn.disabled = true;
  input.disabled = true;
  btn.textContent = 'decrypting…';
  try {
    const plaintext = await decrypt(pw);
    dispatch(plaintext, { persist: true });
    return;
  } catch {
    err.textContent = 'wrong password';
    btn.disabled = false;
    input.disabled = false;
    btn.textContent = 'enter';
    input.focus();
    input.select();
  }
});
</script>
</body>
