<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>internal</title>
<meta name="theme-color" content="#2e3440">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  .gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-top: 32px;
  }
  .gate input {
    background: rgba(76, 86, 106, 0.35);
    border: 1px solid rgba(136, 192, 208, 0.25);
    border-radius: 999px;
    padding: 10px 18px;
    color: #eceff4;
    font-family: inherit;
    font-size: 14px;
    width: 220px;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .gate input:focus { border-color: rgba(136, 192, 208, 0.6); }
  .gate button {
    background: rgba(136, 192, 208, 0.18);
    border: 1px solid rgba(136, 192, 208, 0.4);
    border-radius: 999px;
    padding: 8px 22px;
    color: #eceff4;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .gate button:hover:not(:disabled) { background: rgba(136, 192, 208, 0.3); }
  .gate button:disabled { opacity: 0.6; cursor: wait; }
  .err { color: #bf616a; font-size: 13px; min-height: 18px; }
  #content { display: none; text-align: center; }
</style>
<script src="argon2.js"></script>
</head>
<body>
  <main>
    <div id="gate">
      <h1>internal</h1>
      <form class="gate" id="form" autocomplete="off">
        <input id="pw" type="password" placeholder="password" autofocus>
        <button type="submit">enter</button>
        <div class="err" id="err"></div>
      </form>
    </div>
    <div id="content"></div>
  </main>
<script>
const BLOB = {"salt":"XrPqeJhiQOB8csgRiyEh+Q==","iv":"q/0HbYMq+BDayRPM","ct":"jtwSi3q3dWXBWd6Qdw2xyY3fdnqrNYTfs76Zcm77BIxugMlfB6zLV3cYtdu5JDRXM5VHI/cnqsrC9eNatceJh6IbANVHCtEmhmWFfHwLaBgGWlomkQTsrrW1XM9MLpXnCa4G7caUgw/o","kdf":"argon2id","parallelism":1,"iterations":2,"memorySize":19456,"hashLength":32};

const b64ToBytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(password) {
  const salt = b64ToBytes(BLOB.salt);
  const iv = b64ToBytes(BLOB.iv);
  const ct = b64ToBytes(BLOB.ct);

  const rawKey = await hashwasm.argon2id({
    password,
    salt,
    parallelism: BLOB.parallelism,
    iterations: BLOB.iterations,
    memorySize: BLOB.memorySize,
    hashLength: BLOB.hashLength,
    outputType: 'binary',
  });

  const key = await crypto.subtle.importKey('raw', rawKey, { name: 'AES-GCM' }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return new TextDecoder().decode(pt);
}

const STORAGE_KEY = 'internal_content_v1';

function unlock(html) {
  document.getElementById('gate').style.display = 'none';
  const content = document.getElementById('content');
  content.innerHTML = html + '<button id="logout" style="margin-top:28px;background:transparent;border:1px solid rgba(191,97,106,0.4);color:#bf616a;border-radius:999px;padding:6px 16px;font-family:inherit;font-size:13px;cursor:pointer;">lock</button>';
  content.style.display = 'block';
  document.getElementById('logout').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  });
}

const cached = localStorage.getItem(STORAGE_KEY);
if (cached) unlock(cached);

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.querySelector('.gate button');
  const input = document.getElementById('pw');
  err.textContent = '';
  btn.disabled = true;
  input.disabled = true;
  btn.textContent = 'decrypting…';
  try {
    const html = await decrypt(pw);
    localStorage.setItem(STORAGE_KEY, html);
    unlock(html);
  } catch {
    err.textContent = 'wrong password';
    btn.disabled = false;
    input.disabled = false;
    btn.textContent = 'enter';
    input.focus();
    input.select();
  }
});
</script>
</body>
</html>
